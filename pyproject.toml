[project]
name = "crypto-orderbook-dump"
version = "1.0.0"
description = "A tool to dump cryptocurrency order book data."
requires-python = "~=3.12.0"
dependencies = [
    "aiohttp>=3.13.3",
    "binance-sdk-spot>=8.1.0",
    "huggingface-hub>=1.6.0",
    "kaggle>=2.0.0",
    "polars>=1.38.1",
    "python-dotenv>=1.2.2",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3"]
